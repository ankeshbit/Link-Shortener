name: CI/CD Production Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  code-quality-and-lint:
    name: Code Formatting & Lint Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt
      - name: Run Black Formatter Check
        run: black --check backend/
      - name: Run Isort Import Sorting Check
        run: isort --check-only backend/
      - name: Run Ruff Linter Check
        run: ruff check backend/

  backend-test:
    name: Backend Pytest (PostgreSQL & Redis Services)
    runs-on: ubuntu-latest
    needs: code-quality-and-lint
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: bytelink
          POSTGRES_PASSWORD: bytelink_ci_pass
          POSTGRES_DB: bytelink
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt
      - name: Run Database Migrations
        env:
          DATABASE_URL: postgresql://bytelink:bytelink_ci_pass@localhost:5432/bytelink
        run: |
          cd backend && alembic upgrade head && alembic check
      - name: Run Full Pytest Suite
        env:
          DATABASE_URL: postgresql://bytelink:bytelink_ci_pass@localhost:5432/bytelink
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: ci_test_secret_key_at_least_32_characters_long_abcdef123456
          ALLOW_SHORT_JWT_SECRET: "false"
          ENV: development
          PUBLIC_BASE_URL: http://localhost:8000
        run: |
          pytest backend/test_main.py -v

  frontend-build:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Dependencies
        run: npm ci --prefix frontend
      - name: Lint Frontend Code
        run: npm run lint --prefix frontend
      - name: Run Frontend Tests (Vitest)
        run: npm test --prefix frontend
      - name: Compile and Build
        run: npm run build --prefix frontend

  docker-verify:
    name: Docker Image Build Validation
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Verify Backend Docker Build
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
