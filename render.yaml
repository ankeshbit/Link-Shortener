services:
  # FastAPI Backend Service
  - type: web
    name: bytelink-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: bytelink-redis
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: ENV
        value: production
      - key: FRONTEND_URL
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false

# Redis Cache Service instance
  - type: redis
    name: bytelink-redis
    ipAllowList: [] # Only allow internal connection
